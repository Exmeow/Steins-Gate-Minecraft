plugins {
	id 'java-library'
}

description = 'Pure Java checkpoint control, persistence, and recovery core'

repositories {
	mavenCentral()
}

dependencies {
	api 'com.google.code.gson:gson:2.10.1'
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
