plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = "${project.archives_base_name}-fabric"
}

repositories {
	maven {
		name = 'Twelve Iterations'
		url = 'https://maven.twelveiterations.com/repository/maven-public/'
		content {
			includeGroup 'net.blay09.mods'
		}
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hardcore_checkpoints" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java.srcDir project(':control-core').file('src/main/java')
		java.srcDir project(':common').file('src/main/java')
		resources.srcDir project(':common').file('src/main/resources')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation("net.blay09.mods:balm-fabric:${project.balm_version}") {
		exclude group: 'mezz.jei'
	}

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

evaluationDependsOn(':supervisor')
def embeddedSupervisorJar = project(':supervisor').tasks.named('uberJar')

processResources {
	dependsOn embeddedSupervisorJar
	def version = project.version
	inputs.property 'version', version
	inputs.files(embeddedSupervisorJar)

	from(embeddedSupervisorJar.flatMap { it.archiveFile }) {
		into 'assets/hardcore_checkpoints/runtime'
		rename { 'supervisor.jar' }
	}

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from(rootProject.file('LICENSE')) {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
